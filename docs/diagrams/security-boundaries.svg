<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" font-family="monospace">
  <!-- Security Boundary Diagram -->
  <rect width="800" height="450" fill="#0a0a0f"/>
  <text x="400" y="30" fill="#e4e4e7" font-size="14" text-anchor="middle" font-weight="bold">Ardyn Security Boundaries</text>

  <!-- Trust Zone 1: CLI Input -->
  <rect x="50" y="60" width="200" height="80" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="85" fill="#e4e4e7" font-size="11" text-anchor="middle" font-weight="bold">Boundary 1</text>
  <text x="150" y="100" fill="#a1a1aa" font-size="9" text-anchor="middle">CLI Input</text>
  <text x="150" y="115" fill="#22c55e" font-size="8" text-anchor="middle">path containment</text>
  <text x="150" y="128" fill="#22c55e" font-size="8" text-anchor="middle">assertLocalFilePath</text>

  <!-- Trust Zone 2: Runtime -->
  <rect x="300" y="60" width="200" height="80" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="85" fill="#e4e4e7" font-size="11" text-anchor="middle" font-weight="bold">Boundary 2</text>
  <text x="400" y="100" fill="#a1a1aa" font-size="9" text-anchor="middle">Runtime</text>
  <text x="400" y="115" fill="#22c55e" font-size="8" text-anchor="middle">--enable-runtime + --approve</text>
  <text x="400" y="128" fill="#22c55e" font-size="8" text-anchor="middle">kill switch + redaction</text>

  <!-- Trust Zone 3: Federation -->
  <rect x="550" y="60" width="200" height="80" rx="8" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="85" fill="#e4e4e7" font-size="11" text-anchor="middle" font-weight="bold">Boundary 3</text>
  <text x="650" y="100" fill="#a1a1aa" font-size="9" text-anchor="middle">Federation</text>
  <text x="650" y="115" fill="#22c55e" font-size="8" text-anchor="middle">loopback + redirect:manual</text>
  <text x="650" y="128" fill="#22c55e" font-size="8" text-anchor="middle">host allowlist + cap</text>

  <!-- Trust Zone 4: DB -->
  <rect x="50" y="180" width="200" height="80" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="150" y="205" fill="#e4e4e7" font-size="11" text-anchor="middle" font-weight="bold">Boundary 4</text>
  <text x="150" y="220" fill="#a1a1aa" font-size="9" text-anchor="middle">Database</text>
  <text x="150" y="235" fill="#22c55e" font-size="8" text-anchor="middle">deny-by-default perms</text>
  <text x="150" y="248" fill="#22c55e" font-size="8" text-anchor="middle">SQL injection prevention</text>

  <!-- Trust Zone 5: Secrets -->
  <rect x="300" y="180" width="200" height="80" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="205" fill="#e4e4e7" font-size="11" text-anchor="middle" font-weight="bold">Boundary 5</text>
  <text x="400" y="220" fill="#a1a1aa" font-size="9" text-anchor="middle">Secrets</text>
  <text x="400" y="235" fill="#22c55e" font-size="8" text-anchor="middle">env-only, never committed</text>
  <text x="400" y="248" fill="#22c55e" font-size="8" text-anchor="middle">never logged, never in URLs</text>

  <!-- Trust Zone 6: Console -->
  <rect x="550" y="180" width="200" height="80" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="650" y="205" fill="#e4e4e7" font-size="11" text-anchor="middle" font-weight="bold">Boundary 6</text>
  <text x="650" y="220" fill="#a1a1aa" font-size="9" text-anchor="middle">Console</text>
  <text x="650" y="235" fill="#22c55e" font-size="8" text-anchor="middle">API key middleware</text>
  <text x="650" y="248" fill="#22c55e" font-size="8" text-anchor="middle">runtime gate never bypassed</text>

  <!-- Security Floor -->
  <rect x="50" y="300" width="700" height="120" rx="8" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6"/>
  <text x="400" y="325" fill="#ef4444" font-size="12" text-anchor="middle" font-weight="bold">SECURITY FLOOR (never crosses)</text>
  <text x="80" y="350" fill="#a1a1aa" font-size="9">✗ No P2P/DHT/BitTorrent/libp2p</text>
  <text x="80" y="370" fill="#a1a1aa" font-size="9">✗ No Secure Drop decryption</text>
  <text x="80" y="390" fill="#a1a1aa" font-size="9">✗ No @multiverse/fabric-core import</text>
  <text x="430" y="350" fill="#a1a1aa" font-size="9">✗ No forbidden dependencies</text>
  <text x="430" y="370" fill="#a1a1aa" font-size="9">✗ No CUA/computer-use (stays gated)</text>
  <text x="430" y="390" fill="#a1a1aa" font-size="9">✗ No secrets committed/logged</text>
</svg>