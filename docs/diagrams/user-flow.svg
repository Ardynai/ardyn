<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="monospace">
  <!-- User Flow Diagram -->
  <rect width="800" height="500" fill="#0a0a0f"/>
  <text x="400" y="30" fill="#e4e4e7" font-size="14" text-anchor="middle" font-weight="bold">Ardyn User Flow</text>

  <!-- User -->
  <circle cx="100" cy="100" r="30" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="105" fill="#e4e4e7" font-size="10" text-anchor="middle">User</text>

  <!-- CLI -->
  <rect x="200" y="70" width="120" height="60" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="260" y="95" fill="#e4e4e7" font-size="11" text-anchor="middle">CLI</text>
  <text x="260" y="110" fill="#a1a1aa" font-size="9" text-anchor="middle">12 commands</text>

  <!-- Manifest -->
  <rect x="380" y="70" width="120" height="60" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="95" fill="#e4e4e7" font-size="11" text-anchor="middle">Manifest</text>
  <text x="440" y="110" fill="#a1a1aa" font-size="9" text-anchor="middle">JSON schema</text>

  <!-- Runtime -->
  <rect x="560" y="70" width="120" height="60" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
  <text x="620" y="95" fill="#e4e4e7" font-size="11" text-anchor="middle">Runtime</text>
  <text x="620" y="110" fill="#a1a1aa" font-size="9" text-anchor="middle">spawn + audit</text>

  <!-- Approval gate -->
  <polygon points="620,180 700,220 620,260 540,220" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="215" fill="#e4e4e7" font-size="10" text-anchor="middle">Approval</text>
  <text x="620" y="230" fill="#f59e0b" font-size="9" text-anchor="middle">Gate</text>

  <!-- Process -->
  <rect x="560" y="300" width="120" height="60" rx="8" fill="#1a1a2e" stroke="#818cf8" stroke-width="2"/>
  <text x="620" y="325" fill="#e4e4e7" font-size="11" text-anchor="middle">Process</text>
  <text x="620" y="340" fill="#a1a1aa" font-size="9" text-anchor="middle">stdout/stderr</text>

  <!-- Console -->
  <rect x="200" y="300" width="120" height="60" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="260" y="325" fill="#e4e4e7" font-size="11" text-anchor="middle">Console</text>
  <text x="260" y="340" fill="#a1a1aa" font-size="9" text-anchor="middle">6 views + API</text>

  <!-- Arrows -->
  <line x1="130" y1="100" x2="200" y2="100" stroke="#6366f1" stroke-width="1.5" marker-end="url(#af1)"/>
  <line x1="320" y1="100" x2="380" y2="100" stroke="#22c55e" stroke-width="1.5" marker-end="url(#af1)"/>
  <line x1="500" y1="100" x2="560" y2="100" stroke="#ef4444" stroke-width="1.5" marker-end="url(#af1)"/>
  <line x1="620" y1="130" x2="620" y2="180" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#af1)"/>
  <line x1="620" y1="260" x2="620" y2="300" stroke="#818cf8" stroke-width="1.5" marker-end="url(#af1)"/>
  <line x1="560" y1="330" x2="320" y2="330" stroke="#6366f1" stroke-width="1" stroke-dasharray="4" marker-end="url(#af1)"/>

  <!-- Labels -->
  <text x="170" y="90" fill="#a1a1aa" font-size="8">runs</text>
  <text x="350" y="90" fill="#a1a1aa" font-size="8">loads</text>
  <text x="530" y="90" fill="#a1a1aa" font-size="8">enables</text>
  <text x="630" y="155" fill="#a1a1aa" font-size="8">--approve</text>
  <text x="630" y="285" fill="#a1a1aa" font-size="8">spawns</text>
  <text x="440" y="320" fill="#a1a1aa" font-size="8">SSE stream</text>

  <defs>
    <marker id="af1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>