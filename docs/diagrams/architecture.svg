<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none" font-family="monospace">
  <!-- Ardyn Architecture Diagram -->
  <rect width="900" height="600" fill="#0a0a0f"/>
  
  <!-- Title -->
  <text x="450" y="30" fill="#e4e4e7" font-size="16" text-anchor="middle" font-weight="bold">Ardyn Architecture</text>
  
  <!-- CLI -->
  <rect x="50" y="60" width="180" height="80" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="90" fill="#e4e4e7" font-size="12" text-anchor="middle" font-weight="bold">CLI (apps/cli)</text>
  <text x="140" y="110" fill="#a1a1aa" font-size="10" text-anchor="middle">doctor, plan, serve-runtime</text>
  <text x="140" y="125" fill="#a1a1aa" font-size="10" text-anchor="middle">shell, sqlite, federation</text>
  
  <!-- Core -->
  <rect x="280" y="60" width="180" height="80" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="370" y="90" fill="#e4e4e7" font-size="12" text-anchor="middle" font-weight="bold">Core (packages/core)</text>
  <text x="370" y="110" fill="#a1a1aa" font-size="10" text-anchor="middle">73k lines, 422 exports</text>
  <text x="370" y="125" fill="#a1a1aa" font-size="10" text-anchor="middle">data-auth.mjs (M3)</text>
  
  <!-- Fabric -->
  <rect x="510" y="60" width="180" height="80" rx="8" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="90" fill="#e4e4e7" font-size="12" text-anchor="middle" font-weight="bold">Fabric (packages/fabric)</text>
  <text x="600" y="110" fill="#a1a1aa" font-size="10" text-anchor="middle">Hardened, wired</text>
  <text x="600" y="125" fill="#a1a1aa" font-size="10" text-anchor="middle">loopback, redirect:manual</text>
  
  <!-- SDK -->
  <rect x="730" y="60" width="140" height="80" rx="8" fill="#1a1a2e" stroke="#818cf8" stroke-width="2"/>
  <text x="800" y="90" fill="#e4e4e7" font-size="12" text-anchor="middle" font-weight="bold">SDK</text>
  <text x="800" y="110" fill="#a1a1aa" font-size="10" text-anchor="middle">SessionTrace, Badge</text>
  <text x="800" y="125" fill="#a1a1aa" font-size="10" text-anchor="middle">ManifestViewer, Gate</text>
  
  <!-- Console -->
  <rect x="50" y="200" width="280" height="80" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="190" y="230" fill="#e4e4e7" font-size="12" text-anchor="middle" font-weight="bold">Console (apps/console)</text>
  <text x="190" y="250" fill="#a1a1aa" font-size="10" text-anchor="middle">Next.js 15, React 19</text>
  <text x="190" y="265" fill="#a1a1aa" font-size="10" text-anchor="middle">6 views + 3 API routes</text>
  
  <!-- Rust Host -->
  <rect x="380" y="200" width="180" height="80" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
  <text x="470" y="230" fill="#e4e4e7" font-size="12" text-anchor="middle" font-weight="bold">Rust Host</text>
  <text x="470" y="250" fill="#a1a1aa" font-size="10" text-anchor="middle">stdio_runtime</text>
  <text x="470" y="265" fill="#a1a1aa" font-size="10" text-anchor="middle">policy contracts</text>
  
  <!-- Schemas -->
  <rect x="610" y="200" width="140" height="80" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="680" y="230" fill="#e4e4e7" font-size="12" text-anchor="middle" font-weight="bold">Schemas</text>
  <text x="680" y="250" fill="#a1a1aa" font-size="10" text-anchor="middle">103 JSON Schemas</text>
  <text x="680" y="265" fill="#a1a1aa" font-size="10" text-anchor="middle">manifest, task, session</text>
  
  <!-- Arrows -->
  <line x1="230" y1="100" x2="280" y2="100" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="100" x2="510" y2="100" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="100" x2="730" y2="100" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="140" x2="190" y2="200" stroke="#6366f1" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <line x1="370" y1="140" x2="470" y2="200" stroke="#22c55e" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)"/>
  
  <!-- Trust boundaries -->
  <rect x="30" y="340" width="840" height="230" rx="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="6"/>
  <text x="50" y="365" fill="#ef4444" font-size="11" font-weight="bold">Trust Boundaries</text>
  
  <text x="50" y="390" fill="#a1a1aa" font-size="10">1. CLI input: path containment (assertLocalFilePath)</text>
  <text x="50" y="410" fill="#a1a1aa" font-size="10">2. Runtime: approval-gated (--enable-runtime + --approve), kill switch, redaction</text>
  <text x="50" y="430" fill="#a1a1aa" font-size="10">3. Federation: loopback-only, redirect:manual, host allowlist, response cap</text>
  <text x="50" y="450" fill="#a1a1aa" font-size="10">4. SDK: schema validation, non-authoritative by default</text>
  <text x="50" y="470" fill="#a1a1aa" font-size="10">5. Secrets: env vars only, never committed/logged/persisted</text>
  <text x="50" y="490" fill="#a1a1aa" font-size="10">6. DB: deny-by-default permissions, rate limiting, SQL injection prevention</text>
  
  <!-- Security floor -->
  <text x="50" y="530" fill="#ef4444" font-size="10" font-weight="bold">SECURITY FLOOR: No P2P/DHT • No Secure Drop decrypt • No forbidden deps • CUA gated</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>