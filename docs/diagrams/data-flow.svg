<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="monospace">
  <!-- Data Flow Diagram -->
  <rect width="800" height="500" fill="#0a0a0f"/>
  <text x="400" y="30" fill="#e4e4e7" font-size="14" text-anchor="middle" font-weight="bold">Ardyn Data Flow</text>

  <!-- CLI Input -->
  <rect x="50" y="80" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="120" y="105" fill="#e4e4e7" font-size="11" text-anchor="middle">CLI Input</text>
  <text x="120" y="120" fill="#a1a1aa" font-size="9" text-anchor="middle">args + flags</text>

  <!-- Manifest Validation -->
  <rect x="250" y="80" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="320" y="105" fill="#e4e4e7" font-size="11" text-anchor="middle">Manifest</text>
  <text x="320" y="120" fill="#a1a1aa" font-size="9" text-anchor="middle">JSON Schema</text>

  <!-- Approval Gate -->
  <polygon points="500,110 580,150 500,190 420,150" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="145" fill="#e4e4e7" font-size="10" text-anchor="middle">Approval</text>
  <text x="500" y="160" fill="#f59e0b" font-size="9" text-anchor="middle">Gate</text>

  <!-- Process Spawn -->
  <rect x="620" y="80" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
  <text x="690" y="105" fill="#e4e4e7" font-size="11" text-anchor="middle">Spawn</text>
  <text x="690" y="120" fill="#a1a1aa" font-size="9" text-anchor="middle">child_process</text>

  <!-- JSONL Frames -->
  <rect x="620" y="200" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#818cf8" stroke-width="2"/>
  <text x="690" y="225" fill="#e4e4e7" font-size="11" text-anchor="middle">JSONL Frames</text>
  <text x="690" y="240" fill="#a1a1aa" font-size="9" text-anchor="middle">stdout parse</text>

  <!-- Redaction -->
  <rect x="420" y="200" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
  <text x="490" y="225" fill="#e4e4e7" font-size="11" text-anchor="middle">Redaction</text>
  <text x="490" y="240" fill="#a1a1aa" font-size="9" text-anchor="middle">stderr mask</text>

  <!-- Transcript Audit -->
  <rect x="220" y="200" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="290" y="225" fill="#e4e4e7" font-size="11" text-anchor="middle">Audit Log</text>
  <text x="290" y="240" fill="#a1a1aa" font-size="9" text-anchor="middle">events + timestamps</text>

  <!-- Kill Switch -->
  <rect x="620" y="320" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
  <text x="690" y="345" fill="#e4e4e7" font-size="11" text-anchor="middle">Kill Switch</text>
  <text x="690" y="360" fill="#a1a1aa" font-size="9" text-anchor="middle">SIGTERM</text>

  <!-- JSON Output -->
  <rect x="250" y="320" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="320" y="345" fill="#e4e4e7" font-size="11" text-anchor="middle">JSON Output</text>
  <text x="320" y="360" fill="#a1a1aa" font-size="9" text-anchor="middle">stdout</text>

  <!-- SSE Buffer -->
  <rect x="50" y="320" width="140" height="60" rx="8" fill="#1a1a2e" stroke="#818cf8" stroke-width="2"/>
  <text x="120" y="345" fill="#e4e4e7" font-size="11" text-anchor="middle">SSE Buffer</text>
  <text x="120" y="360" fill="#a1a1aa" font-size="9" text-anchor="middle">.ardyn-events/</text>

  <!-- Arrows -->
  <line x1="190" y1="110" x2="250" y2="110" stroke="#6366f1" stroke-width="1.5" marker-end="url(#df1)"/>
  <line x1="390" y1="110" x2="420" y2="150" stroke="#22c55e" stroke-width="1.5" marker-end="url(#df1)"/>
  <line x1="580" y1="150" x2="620" y2="110" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#df1)"/>
  <line x1="690" y1="140" x2="690" y2="200" stroke="#818cf8" stroke-width="1.5" marker-end="url(#df1)"/>
  <line x1="620" y1="230" x2="560" y2="230" stroke="#ef4444" stroke-width="1.5" marker-end="url(#df1)"/>
  <line x1="420" y1="230" x2="360" y2="230" stroke="#22c55e" stroke-width="1.5" marker-end="url(#df1)"/>
  <line x1="690" y1="260" x2="690" y2="320" stroke="#ef4444" stroke-width="1" stroke-dasharray="4" marker-end="url(#df1)"/>
  <line x1="290" y1="260" x2="320" y2="320" stroke="#22c55e" stroke-width="1.5" marker-end="url(#df1)"/>
  <line x1="250" y1="350" x2="190" y2="350" stroke="#818cf8" stroke-width="1" stroke-dasharray="4" marker-end="url(#df1)"/>

  <defs>
    <marker id="df1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>