<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" font-family="monospace">
  <!-- Deployment Diagram -->
  <rect width="800" height="400" fill="#0a0a0f"/>
  <text x="400" y="30" fill="#e4e4e7" font-size="14" text-anchor="middle" font-weight="bold">Ardyn Deployment</text>

  <!-- Local Dev -->
  <rect x="50" y="60" width="300" height="140" rx="8" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="6"/>
  <text x="200" y="80" fill="#6366f1" font-size="11" text-anchor="middle" font-weight="bold">Local Development</text>
  <rect x="80" y="100" width="100" height="50" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="120" fill="#e4e4e7" font-size="10" text-anchor="middle">CLI</text>
  <text x="130" y="135" fill="#a1a1aa" font-size="8" text-anchor="middle">node apps/cli</text>
  <rect x="200" y="100" width="120" height="50" rx="6" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="260" y="120" fill="#e4e4e7" font-size="10" text-anchor="middle">Console</text>
  <text x="260" y="135" fill="#a1a1aa" font-size="8" text-anchor="middle">next dev</text>
  <rect x="80" y="160" width="240" height="30" rx="6" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="180" fill="#a1a1aa" font-size="9" text-anchor="middle">.ardyn-events/ (SSE buffer)</text>

  <!-- Docker -->
  <rect x="450" y="60" width="300" height="140" rx="8" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="6"/>
  <text x="600" y="80" fill="#22c55e" font-size="11" text-anchor="middle" font-weight="bold">Docker Container</text>
  <rect x="480" y="100" width="100" height="50" rx="6" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="530" y="120" fill="#e4e4e7" font-size="10" text-anchor="middle">Rust binary</text>
  <text x="530" y="135" fill="#a1a1aa" font-size="8" text-anchor="middle">session.rs</text>
  <rect x="600" y="100" width="120" height="50" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="660" y="120" fill="#e4e4e7" font-size="10" text-anchor="middle">Console</text>
  <text x="660" y="135" fill="#a1a1aa" font-size="8" text-anchor="middle">next start :3000</text>
  <rect x="480" y="160" width="240" height="30" rx="6" fill="#1a1a2e" stroke="#ef4444" stroke-width="1"/>
  <text x="600" y="180" fill="#a1a1aa" font-size="9" text-anchor="middle">node:22-slim + Rust toolchain</text>

  <!-- Vercel -->
  <rect x="250" y="240" width="300" height="120" rx="8" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6"/>
  <text x="400" y="260" fill="#818cf8" font-size="11" text-anchor="middle" font-weight="bold">Vercel (Production)</text>
  <rect x="280" y="280" width="100" height="50" rx="6" fill="#1a1a2e" stroke="#818cf8" stroke-width="2"/>
  <text x="330" y="300" fill="#e4e4e7" font-size="10" text-anchor="middle">Console</text>
  <text x="330" y="315" fill="#a1a1aa" font-size="8" text-anchor="middle">SSR + static</text>
  <rect x="420" y="280" width="100" height="50" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
  <text x="470" y="300" fill="#e4e4e7" font-size="10" text-anchor="middle">API Routes</text>
  <text x="470" y="315" fill="#a1a1aa" font-size="8" text-anchor="middle">5 endpoints</text>

  <!-- Arrows -->
  <line x1="350" y1="130" x2="450" y2="130" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3"/>
  <text x="400" y="125" fill="#a1a1aa" font-size="8" text-anchor="middle">or</text>
  <line x1="600" y1="200" x2="500" y2="240" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3"/>
  <text x="560" y="225" fill="#a1a1aa" font-size="8" text-anchor="middle">or</text>
</svg>