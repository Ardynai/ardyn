name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: debug after npm ci
        run: |
          echo "--- status porcelain AFTER npm ci ---"
          git status --porcelain
          echo "--- diff stat vs baseline AFTER npm ci ---"
          git diff --stat 1e50b36ad77400686e09ba0c3998131d1911d83c -- apps/cli/src/index.mjs crates/ardyn-host/src/lib.rs crates/ardyn-host/src/stdio_runtime/mod.rs packages/fabric/src/index.mjs package.json || true
          echo "--- raw diff package.json cat -A ---"
          git diff -- package.json | cat -A | head -40 || true
      - run: node --test "tests/*.test.mjs"
      - run: npm run report:phase-status
        continue-on-error: true
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
  node-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test "tests/*.test.mjs"